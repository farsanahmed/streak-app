name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare release keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.p12 ]; then
            echo "No committed keystore found, generating a new one."
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore keystore/release.p12 -alias streak \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass streak -keypass streak \
              -dname "CN=Streak, OU=Development, O=Streak, L=Unknown, ST=Unknown, C=US"
          else
            echo "Using committed release keystore."
          fi
          ls -l keystore

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: streak-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: keystore/release.p12
          if-no-files-found: error

      - name: Publish GitHub Release with APK assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$DEBUG_APK#Streak-debug.apk" \
              "$RELEASE_APK#Streak-release.apk" \
              --clobber
          else
            gh release create "$TAG" \
              "$DEBUG_APK#Streak-debug.apk" \
              "$RELEASE_APK#Streak-release.apk" \
              --title "Streak build ${{ github.run_number }}" \
              --notes "Automated build of commit ${{ github.sha }}." \
              --target "${{ github.sha }}"
          fi
